[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shopease-agent"
version = "0.1.0"
description = "A Zero-Trust LangGraph refund agent with an atomic, race-free refund ledger."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.7,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-text-splitters>=1.1,<2",
    "chromadb>=1.5,<2",
    "pypdf>=7,<8",
    "pandas>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17", "ipykernel", "nbformat", "nbclient"]

[project.scripts]
shopease = "shopease_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
extend-exclude = ["docs"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
